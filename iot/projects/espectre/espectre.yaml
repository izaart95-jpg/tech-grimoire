esphome:
  name: espectre
  min_version: 2025.11.0

esp32:
  board: esp32dev
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

# Load the ESPectre component from GitHub
external_components:
  - source:
      type: git
      url: https://github.com/francescopace/espectre
      ref: 3.0.0
    components: [ espectre ]
    refresh: always

# ESPectre - WiFi CSI Motion Detection
espectre:
  id: espectre_csi

wifi:
  ssid: "ROUTER-SSID"
  password: ""

api:

logger:
